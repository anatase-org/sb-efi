name: Builder

on:
  workflow_dispatch:
    inputs:
      fedora_version:
        description: Fedora release version
        required: false
        default: "44"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Login to GHCR
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build and push builder
        env:
          FEDORA_VERSION: ${{ inputs.fedora_version }}
          ARCH: ${{ matrix.arch }}
          PUSH_IMAGE: "1"
        run: ./builder.sh
